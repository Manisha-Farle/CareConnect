<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareConnect - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                CareConnect
            </div>

            <a href="index.html" class="login-btn">
                Home
            </a>

        </nav>

    </header>


    <!-- REGISTER -->

    <section class="login-section">

        <div class="login-card">

            <h2>Create Account</h2>

            <p>
                Register to access CareConnect services
            </p>

            <form id="registerForm">

    <input
        type="text"
        name="name"
        id="registerName"
        placeholder="Full Name"
        required
    >

    <input
        type="email"
        name="email"
        id="registerEmail"
        placeholder="Email Address"
        required
    >

    <input
        type="tel"
        name="phone"
        id="registerPhone"
        placeholder="Phone Number"
        required
    >

    <input
        type="password"
        name="password"
        id="registerPassword"
        placeholder="Password"
        required
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
    >

    <button type="submit">
        Create Account
    </button>

</form>
            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h2>CareConnect</h2>

        <p>
            Helping Communities Access Online Healthcare Services
        </p>

        <p>
            © 2026 CareConnect. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
