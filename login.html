<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareConnect - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                CareConnect
            </div>

            <a href="index.html" class="login-btn">
                Home
            </a>

        </nav>

    </header>


    <!-- LOGIN -->

    <section class="login-section">

        <div class="login-card">

            <h2>Login</h2>

            <p>
                Login to access CareConnect services
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    name="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h2>CareConnect</h2>

        <p>
            Helping Communities Access Online Healthcare Services
        </p>

        <p>
            © 2026 CareConnect. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
